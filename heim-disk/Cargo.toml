[package]
name = "heim-disk"
version = "0.1.0-rc.1"
authors = ["svartalf <self@svartalf.info>"]
edition = "2018"
description = "Cross-platform disk information"
keywords = ["heim", "system", "disk", "partition", "filesystem"]
categories = ["asynchronous", "os", "api-bindings"]
repository = "https://github.com/heim-rs/heim"
readme = "README.md"
license = "Apache-2.0 OR MIT"

[dependencies]
heim-common = { version = "0.1.0-rc.1", path = "../heim-common" }
heim-runtime = { version = "0.1.0-rc.1", path = "../heim-runtime" }
cfg-if = "^1.0"
bitflags = "1.0.4"

[target.'cfg(unix)'.dependencies]
libc = "^0.2"

[target.'cfg(target_os = "windows")'.dependencies]
widestring = "0.4.0"

[target.'cfg(target_os = "windows")'.dependencies.winapi]
version = ">=0.3.8"
features = ["std", "winnt", "ntdef", "fileapi", "handleapi",
            "ioapiset", "winioctl", "impl-default", "errhandlingapi",
            "winerror", "winbase", "ws2def"]

[target.'cfg(target_os = "macos")'.dependencies]
mach = "0.3.2"
core-foundation = "^0.9"

[target.'cfg(target_os = "illumos")'.dependencies]
# Use the ks_class fix until it is available in a crates.io release.
kstat-rs = { git = "https://github.com/oxidecomputer/kstat-rs", rev = "ec6d3afd0542a9c0bd80bcaa7a4348017665334a" }

[dev-dependencies]
heim-derive = { version = "0.1.0-rc.1", path = "../heim-derive" }
smol = "^1.2"
futures = "^0.3"
version-sync = "0.9"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
